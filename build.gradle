plugins {
	id 'dev.kikugie.stonecutter'
	id 'dev.kikugie.loom-back-compat'
	id 'maven-publish'
}

base {
	archivesName = "cozmetics"
}
version = "${sc.current.version}+${project.version}"

repositories {
	mavenCentral()
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroupByRegex("software\\.bernie.*")
			includeGroup("com.eliotlash.mclib")
		}
	}
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup("com.terraformersmc")
		}
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cozmetics" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (project.hasProperty("yarn_mappings") && project.yarn_mappings && !project.yarn_mappings.toString().trim().isEmpty()) {
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cross-version annotations
	compileOnly "org.jspecify:jspecify:1.0.0"

	// GeckoLib for animated 3D cosmetic rendering
	if (project.hasProperty("geckolib_dependency") && project.geckolib_dependency) {
		modImplementation "${project.geckolib_dependency}"
	} else {
		modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
	}

	// Optional Mod Menu integration (compileOnly so there is no hard runtime dependency)
	if (project.hasProperty("modmenu_version") && project.modmenu_version) {
		modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	}

	// Universal Image Pipeline: TwelveMonkeys pure-Java decoders for WebP (static & animated), TIFF, BMP
	implementation "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-core:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-metadata:3.12.0"
	include "com.twelvemonkeys.common:common-lang:3.12.0"
	include "com.twelvemonkeys.common:common-io:3.12.0"
	include "com.twelvemonkeys.common:common-image:3.12.0"

	implementation "com.twelvemonkeys.imageio:imageio-tiff:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-tiff:3.12.0"

	implementation "com.twelvemonkeys.imageio:imageio-bmp:3.12.0"
	include "com.twelvemonkeys.imageio:imageio-bmp:3.12.0"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	def mcCompat = project.findProperty("mc_compat") ?: "${sc.current.version}"
	def javaVer = project.findProperty("java_target") ?: "21"
	inputs.property "version", version
	inputs.property "mc_compat", mcCompat
	inputs.property "java_version", javaVer

	filesMatching("fabric.mod.json") {
		expand "version": version, "mc_compat": mcCompat, "java_version": javaVer
	}
}

def javaTarget = Integer.parseInt(project.findProperty("java_target")?.toString() ?: "21")

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaTarget
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(javaTarget)
	}

	sourceCompatibility = JavaVersion.toVersion(javaTarget)
	targetCompatibility = JavaVersion.toVersion(javaTarget)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
