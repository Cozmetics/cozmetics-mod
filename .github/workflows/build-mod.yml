name: Build This Minecraft Mod

on:
  workflow_dispatch:
    inputs:
      custom_ref:
        description: Optional tag or full commit SHA. Leave empty to build the selected workflow branch.
        required: false
        default: ""
        type: string
      java_version:
        description: Java version
        required: true
        default: "21"
        type: choice
        options:
          - "17"
          - "21"
          - "25"
      build_task:
        description: Supported Gradle build task
        required: true
        default: build
        type: choice
        options:
          - build
          - clean build
          - assemble
          - remapJar

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-${{ inputs.custom_ref }}-java${{ inputs.java_version }}-${{ inputs.build_task }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and publish mod JARs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out this repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: mod-source
          submodules: recursive
          lfs: true
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve exact source revision
        id: source
        env:
          CUSTOM_REF_INPUT: ${{ inputs.custom_ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$CUSTOM_REF_INPUT" =~ [[:cntrl:]] ]]; then
            printf '%s\n' 'The tag or commit value must not contain control characters.' >&2
            exit 1
          fi

          custom_ref="${CUSTOM_REF_INPUT#"${CUSTOM_REF_INPUT%%[![:space:]]*}"}"
          custom_ref="${custom_ref%"${custom_ref##*[![:space:]]}"}"

          if [[ -z "$custom_ref" ]]; then
            if [[ "$EVENT_REF_TYPE" != "branch" ]]; then
              printf '%s\n' \
                'Empty custom ref mode requires a branch in the "Use workflow from" selector.' >&2
              exit 1
            fi
            if [[ ! "$EVENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf 'Invalid workflow event commit SHA: %s\n' "$EVENT_SHA" >&2
              exit 1
            fi
            if ! target_commit="$(git -C mod-source rev-parse --verify --end-of-options "${EVENT_SHA}^{commit}" 2>/dev/null)"; then
              printf 'Selected workflow commit is unavailable: %s\n' "$EVENT_SHA" >&2
              exit 1
            fi
            source_kind="branch"
            display_ref="$EVENT_REF_NAME"
          elif [[ "$custom_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            if ! target_commit="$(git -C mod-source rev-parse --verify --end-of-options "${custom_ref}^{commit}" 2>/dev/null)"; then
              printf 'Commit is not available in this repository: %s\n' "$custom_ref" >&2
              exit 1
            fi
            source_kind="commit"
            display_ref="${target_commit:0:12}"
          else
            if [[ "$custom_ref" == -* ]] || ! git -C mod-source check-ref-format "refs/tags/$custom_ref"; then
              printf 'Invalid tag name: %s\n' "$custom_ref" >&2
              exit 1
            fi
            if ! target_commit="$(git -C mod-source rev-parse --verify --end-of-options "refs/tags/${custom_ref}^{commit}" 2>/dev/null)"; then
              printf 'Tag does not exist or does not point to a commit: %s\n' "$custom_ref" >&2
              exit 1
            fi
            source_kind="tag"
            display_ref="$custom_ref"
          fi

          git -C mod-source checkout --detach "$target_commit"
          source_commit="$(git -C mod-source rev-parse HEAD)"
          if [[ "$source_commit" != "$target_commit" ]] || [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'Failed to check out the resolved source commit exactly.' >&2
            exit 1
          fi

          {
            printf 'target_ref=%s\n' "$source_commit"
            printf 'display_ref=%s\n' "$display_ref"
            printf 'source_kind=%s\n' "$source_kind"
            printf 'source_commit=%s\n' "$source_commit"
          } >> "$GITHUB_OUTPUT"

          printf 'Build source type: %s\n' "$source_kind"
          printf 'Display ref: %s\n' "$display_ref"
          printf 'Exact source commit: %s\n' "$source_commit"
          printf 'Workflow event ref: %s\n' "$EVENT_REF"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle Wrapper
        run: |
          set -euo pipefail
          if [[ ! -f mod-source/gradlew ]]; then
            printf '%s\n' \
              'Gradle Wrapper not found.' \
              '' \
              'This workflow requires the repository to include a gradlew file.' \
              'Projects using Maven or a custom build system are not supported.'
            exit 1
          fi
          chmod +x mod-source/gradlew

      - name: Show build environment
        working-directory: mod-source
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          SOURCE_KIND: ${{ steps.source.outputs.source_kind }}
          DISPLAY_REF: ${{ steps.source.outputs.display_ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          JAVA_VERSION_INPUT: ${{ inputs.java_version }}
          BUILD_TASK: ${{ inputs.build_task }}
        run: |
          set -euo pipefail
          printf 'Repository: %s\n' "$CURRENT_REPOSITORY"
          printf 'Build source type: %s\n' "$SOURCE_KIND"
          printf 'Display ref: %s\n' "$DISPLAY_REF"
          printf 'Exact source commit: %s\n' "$SOURCE_COMMIT"
          printf 'Java version: %s\n' "$JAVA_VERSION_INPUT"
          printf 'Build task: %s\n' "$BUILD_TASK"
          printf 'Runner operating system: %s\n' "$RUNNER_OS"
          java -version
          ./gradlew --version --no-daemon

      - name: Run selected Gradle task
        working-directory: mod-source
        env:
          BUILD_TASK: ${{ inputs.build_task }}
        run: |
          set -euo pipefail
          case "$BUILD_TASK" in
            "build")
              ./gradlew build --stacktrace --no-daemon
              ;;
            "clean build")
              ./gradlew clean build --stacktrace --no-daemon
              ;;
            "assemble")
              ./gradlew assemble --stacktrace --no-daemon
              ;;
            "remapJar")
              ./gradlew remapJar --stacktrace --no-daemon
              ;;
            *)
              printf 'Unsupported build task: %s\n' "$BUILD_TASK" >&2
              exit 1
              ;;
          esac

      - name: Collect installable JARs
        run: |
          set -euo pipefail
          stage_dir="artifacts/mod-jars"
          rm -rf -- "$stage_dir"
          mkdir -p -- "$stage_dir"
          candidate_count=0
          staged_count=0

          while IFS= read -r -d '' jar_path; do
            candidate_count=$((candidate_count + 1))
            printf 'Candidate: %s\n' "$jar_path"
            filename="$(basename -- "$jar_path")"
            lowercase="${filename,,}"

            case "$lowercase" in
              *-sources.jar|*-source.jar|*-javadoc.jar|*-dev.jar|*-test.jar|*-tests.jar|*-shadow-dev.jar|*-all-dev.jar|*-test-fixtures.jar|*-testfixtures.jar|*-tmp.jar|*-temp.jar|*-intermediary.jar)
                printf 'Excluded non-installable variant: %s\n' "$jar_path"
                continue
                ;;
            esac

            destination="$stage_dir/$filename"
            if [[ -e "$destination" ]]; then
              stem="${filename%.jar}"
              suffix=2
              destination="$stage_dir/${stem}-${suffix}.jar"
              while [[ -e "$destination" ]]; do
                suffix=$((suffix + 1))
                destination="$stage_dir/${stem}-${suffix}.jar"
              done
            fi

            cp -- "$jar_path" "$destination"
            staged_count=$((staged_count + 1))
            printf 'Staged: %s\n' "$destination"
          done < <(find mod-source -type f -path '*/build/libs/*.jar' -print0 | sort -z)

          printf 'Found %d candidate JAR(s); staged %d installable JAR(s).\n' \
            "$candidate_count" "$staged_count"

          if (( staged_count == 0 )); then
            printf '%s\n' \
              '' \
              'No installable mod JAR was found.' \
              '' \
              'The workflow searched recursively under:' \
              'mod-source/**/build/libs/*.jar' \
              '' \
              'Common sources, javadoc, development, and test JARs were excluded.' \
              '' \
              'The project may:' \
              '- Require a different Gradle task' \
              '- Use a custom output directory' \
              '- Have failed to produce a release JAR' \
              '- Use Maven instead of Gradle' \
              '- Require additional setup'
            exit 1
          fi

          printf '%s\n' 'Final release assets:'
          find "$stage_dir" -maxdepth 1 -type f -name '*.jar' -print | sort

      - name: Prepare release metadata
        id: release_metadata
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          SOURCE_KIND: ${{ steps.source.outputs.source_kind }}
          DISPLAY_REF: ${{ steps.source.outputs.display_ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          JAVA_VERSION_INPUT: ${{ inputs.java_version }}
          BUILD_TASK: ${{ inputs.build_task }}
        run: |
          set -euo pipefail

          sanitize_tag_part() {
            local value="$1"
            value="$(printf '%s' "$value" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/\.\.+/-/g; s/^-+//; s/-+$//')"
            if [[ -z "$value" ]]; then
              value="ref"
            fi
            printf '%s' "$value"
          }

          repository_name="${CURRENT_REPOSITORY#*/}"
          safe_repository="$(sanitize_tag_part "$repository_name")"
          safe_source_kind="$(sanitize_tag_part "$SOURCE_KIND")"
          safe_ref="$(sanitize_tag_part "$DISPLAY_REF")"
          safe_repository="${safe_repository:0:50}"
          safe_source_kind="${safe_source_kind:0:12}"
          safe_ref="${safe_ref:0:60}"
          release_tag="build-${safe_repository}-${safe_source_kind}-${safe_ref}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          display_ref="$(printf '%s' "$DISPLAY_REF" | tr '\r\n\t`' '    ' | cut -c1-160)"
          release_title="${repository_name} ${display_ref} — Java ${JAVA_VERSION_INPUT}"
          release_notes_file="$RUNNER_TEMP/portable-modbuilder-release-notes.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            printf '%s\n\n' '## Portable ModBuilder Build'
            printf '**Repository:** [%s](%s/%s)  \n' "$CURRENT_REPOSITORY" "$GITHUB_SERVER_URL" "$CURRENT_REPOSITORY"
            printf '**Build source:** `%s`  \n' "$SOURCE_KIND"
            printf '**Source ref:** `%s`  \n' "$display_ref"
            printf '**Exact source commit:** [`%s`](%s/%s/commit/%s)  \n' "$SOURCE_COMMIT" "$GITHUB_SERVER_URL" "$CURRENT_REPOSITORY" "$SOURCE_COMMIT"
            printf '**Java version:** `%s`  \n' "$JAVA_VERSION_INPUT"
            printf '**Gradle task:** `%s`  \n' "$BUILD_TASK"
            printf '**Workflow run:** [%s](%s)  \n\n' "$GITHUB_RUN_NUMBER" "$run_url"
            printf '%s\n\n' 'These files were built automatically from this repository by the portable ModBuilder workflow.'
            printf '%s\n' 'Only use compiled files when you trust the repository source from which they were built.'
          } > "$release_notes_file"

          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'release_title=%s\n' "$release_title"
            printf 'release_notes_file=%s\n' "$release_notes_file"
          } >> "$GITHUB_OUTPUT"

          printf 'Release tag: %s\n' "$release_tag"
          printf 'Release title: %s\n' "$release_title"

      - name: Create release and upload JARs
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release_metadata.outputs.release_title }}
          RELEASE_NOTES_FILE: ${{ steps.release_metadata.outputs.release_notes_file }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            artifacts/mod-jars/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --latest=false
          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          printf 'Release URL: %s\n' "$release_url"
          printf 'release_url=%s\n' "$release_url" >> "$GITHUB_OUTPUT"

      - name: Write success summary
        if: steps.publish_release.outcome == 'success'
        env:
          RELEASE_URL: ${{ steps.publish_release.outputs.release_url }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          SOURCE_KIND: ${{ steps.source.outputs.source_kind }}
          DISPLAY_REF: ${{ steps.source.outputs.display_ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          JAVA_VERSION_INPUT: ${{ inputs.java_version }}
          BUILD_TASK: ${{ inputs.build_task }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' '## Build completed successfully'
            printf '%s\n\n' 'The mod was built and published as a GitHub release.'
            printf '**Repository:** %s  \n' "$CURRENT_REPOSITORY"
            printf '**Build source:** %s  \n' "$SOURCE_KIND"
            printf '**Ref:** %s  \n' "$DISPLAY_REF"
            printf '**Commit:** %s  \n' "$SOURCE_COMMIT"
            printf '**Java:** %s  \n' "$JAVA_VERSION_INPUT"
            printf '**Build task:** %s  \n\n' "$BUILD_TASK"
            printf '[Download the compiled JAR from the generated release](%s)\n' "$RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery JARs when release publishing fails
        if: always() && steps.publish_release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars-release-publishing-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mod-jars/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Report release publishing failure
        if: always() && steps.publish_release.outcome == 'failure'
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Compilation succeeded, but GitHub Release publishing failed.' \
            'The compiled JARs were uploaded as a recovery artifact for 7 days.' \
            'Possible causes include missing contents: write permission, disabled workflow write permissions, a duplicate tag, a GitHub API outage, invalid release metadata, or a GitHub CLI failure.' >&2
          {
            printf '%s\n\n' '## Build succeeded, but release publishing failed'
            printf '%s\n' 'The compiled JARs are available in the recovery artifact for 7 days.'
            printf '%s\n' 'Check workflow permissions, the generated tag, GitHub service status, and the GitHub CLI output above.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload build failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portable-modbuilder-failure-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mod-source/**/build/reports/**
            mod-source/**/build/test-results/**
            mod-source/**/build/*.log
            mod-source/**/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7
