name: Build Mod (Manual)

on:
  workflow_dispatch:
    inputs:
      v_1_21_11:
        description: "Minecraft 1.21.11"
        type: boolean
        default: true
      v_1_21_10:
        description: "Minecraft 1.21.10"
        type: boolean
        default: false
      v_1_21_8:
        description: "Minecraft 1.21.8"
        type: boolean
        default: false
      v_1_21_7:
        description: "Minecraft 1.21.7"
        type: boolean
        default: false
      v_1_21_6:
        description: "Minecraft 1.21.6"
        type: boolean
        default: false
      v_1_21_5:
        description: "Minecraft 1.21.5"
        type: boolean
        default: false
      v_1_21_4:
        description: "Minecraft 1.21.4"
        type: boolean
        default: false
      v_1_21_3:
        description: "Minecraft 1.21.3"
        type: boolean
        default: false
      v_1_21_1:
        description: "Minecraft 1.21.1"
        type: boolean
        default: false
      v_1_21:
        description: "Minecraft 1.21"
        type: boolean
        default: false
      v_26_3:
        description: "Minecraft 26.3"
        type: boolean
        default: false
      v_26_2:
        description: "Minecraft 26.2"
        type: boolean
        default: false
      v_26_1_2:
        description: "Minecraft 26.1.2"
        type: boolean
        default: false
      v_26_1:
        description: "Minecraft 26.1"
        type: boolean
        default: false
      all_versions:
        description: "Build ALL versions"
        type: boolean
        default: false
      publish_release:
        description: "Publish/attach JARs to GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Cozmetics Mod JARs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (for 1.21.x)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Java 25 (for 26.x & Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Target Version(s)
        run: |
          set -euo pipefail

          VERSIONS=()
          if [ "${{ inputs.all_versions }}" = "true" ]; then
            VERSIONS=("1.21.11" "1.21.10" "1.21.8" "1.21.7" "1.21.6" "1.21.5" "1.21.4" "1.21.3" "1.21.1" "1.21" "26.3" "26.2" "26.1.2" "26.1")
          else
            [ "${{ inputs.v_1_21_11 }}" = "true" ] && VERSIONS+=("1.21.11")
            [ "${{ inputs.v_1_21_10 }}" = "true" ] && VERSIONS+=("1.21.10")
            [ "${{ inputs.v_1_21_8 }}" = "true" ] && VERSIONS+=("1.21.8")
            [ "${{ inputs.v_1_21_7 }}" = "true" ] && VERSIONS+=("1.21.7")
            [ "${{ inputs.v_1_21_6 }}" = "true" ] && VERSIONS+=("1.21.6")
            [ "${{ inputs.v_1_21_5 }}" = "true" ] && VERSIONS+=("1.21.5")
            [ "${{ inputs.v_1_21_4 }}" = "true" ] && VERSIONS+=("1.21.4")
            [ "${{ inputs.v_1_21_3 }}" = "true" ] && VERSIONS+=("1.21.3")
            [ "${{ inputs.v_1_21_1 }}" = "true" ] && VERSIONS+=("1.21.1")
            [ "${{ inputs.v_1_21 }}" = "true" ] && VERSIONS+=("1.21")
            [ "${{ inputs.v_26_3 }}" = "true" ] && VERSIONS+=("26.3")
            [ "${{ inputs.v_26_2 }}" = "true" ] && VERSIONS+=("26.2")
            [ "${{ inputs.v_26_1_2 }}" = "true" ] && VERSIONS+=("26.1.2")
            [ "${{ inputs.v_26_1 }}" = "true" ] && VERSIONS+=("26.1")
          fi

          if [ "${#VERSIONS[@]}" -eq 0 ]; then
            echo "No version selected, defaulting to 1.21.11"
            VERSIONS=("1.21.11")
          fi

          echo "Target versions count: ${#VERSIONS[@]}"
          echo "Building versions: ${VERSIONS[*]}"

          for ver in "${VERSIONS[@]}"; do
            echo "::group::Building Cozmetics for Minecraft $ver"
            if ./gradlew ":$ver:remapJar" --stacktrace --no-daemon; then
              echo ">>> Successfully built $ver"
            else
              echo "::warning::Build for $ver failed"
              if [ "${{ inputs.all_versions }}" != "true" ] && [ "${#VERSIONS[@]}" -eq 1 ]; then
                exit 1
              fi
            fi
            echo "::endgroup::"
          done

      - name: Stage Built Mod JARs
        id: stage_jars
        run: |
          set -euo pipefail
          mkdir -p dist

          find . -type f -path "*/build/libs/*.jar" | while read -r jar; do
            case "$(basename "$jar")" in
              *-sources.jar|*-source.jar|*-javadoc.jar|*-dev.jar|*-test.jar)
                continue
                ;;
              *)
                echo "Found installable JAR: $jar"
                cp "$jar" dist/
                ;;
            esac
          done

          jar_count=$(find dist/ -type f -name "*.jar" | wc -l | tr -d " ")
          echo "Total staged JARs: $jar_count"
          echo "count=$jar_count" >> "$GITHUB_OUTPUT"

          if [ "$jar_count" -eq 0 ]; then
            echo "::error::No installable JARs were produced!"
            exit 1
          fi

          ls -lh dist/

      - name: Upload Mod JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cozmetics-mod-jars
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: ${{ inputs.publish_release && steps.stage_jars.outputs.count > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="v1.5.0"
          TITLE="Cozmetics v1.5.0 Multi-Version Release"

          echo "Publishing JARs to release $TAG_NAME..."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.jar --clobber
          else
            gh release create "$TAG_NAME" dist/*.jar \
              --title "$TITLE" \
              --notes "Automated multi-version release build for Cozmetics."
          fi
